# ============================================
# 极核 ZEEHO 签到脚本 — Quantumult X 远程重写
# ============================================
# 一键导入方法：
# QX → 右下角风车 → 重写 → 规则资源 → 右上角 + → 输入下方 raw 链接 → 保存
# https://raw.githubusercontent.com/mlink798/ZEEHO/main/script/zeeho_qx_rewrite.conf
# ============================================

[rewrite_local]
# 极核数据面板（访问 http://zeeho.box 时拦截并返回实时数据页面）
^http://zeeho\.box url script-request-header https://raw.githubusercontent.com/mlink798/ZEEHO/main/script/zeeho_box_enhanced.js

# 自动抓取 Token（打开极核 App「我的」页面时捕获 Authorization）
^https:\/\/tapi\.zeehoev\.com\/v1\.0\/mine\/cfmotoservermine\/setting url script-response-body https://raw.githubusercontent.com/mlink798/ZEEHO/main/script/zeeho.js

[mitm]
hostname = tapi.zeehoev.com, zeeho.box